<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE·CREA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: una sola columna tipo app móvil; cada paso es una pantalla; azul laguna = calmar, ámbar = mover */
:root{
  --bg:#F1F5F6; --surface:#FFFFFF; --ink:#14303E; --muted:#587180; --line:#D4E0E4;
  --calma:#26768F; --calma-soft:#DCEEF3; --mov:#B86A14; --mov-soft:#F7E8D4;
  --brand:#D9601B; --ok:#2E7D4F; --warn:#A35A00; --danger:#B3261E;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C23; --surface:#162932; --ink:#E4EFF2; --muted:#93AAB4; --line:#29414C;
  --calma:#6BBFD7; --calma-soft:#1B3A46; --mov:#F0A456; --mov-soft:#3B2C1B;
  --brand:#F68A45; --ok:#6FCF97; --warn:#F2B35B; --danger:#F28B82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C23; --surface:#162932; --ink:#E4EFF2; --muted:#93AAB4; --line:#29414C;
  --calma:#6BBFD7; --calma-soft:#1B3A46; --mov:#F0A456; --mov-soft:#3B2C1B;
  --brand:#F68A45; --ok:#6FCF97; --warn:#F2B35B; --danger:#F28B82; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.brandwrap img{width:40px;height:auto}
.brand{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;margin:0;color:var(--ink);letter-spacing:.02em}
.brand .dot{color:var(--brand)}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:4px 8px}

.hero img{width:220px;max-width:70vw;height:auto;display:block}
.hero .name{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;letter-spacing:.03em;margin:8px 0 2px}
.hero .name .dot{color:var(--brand)}
.hero .tagline{font-weight:700;font-size:1.05rem}
.hero .sub{color:var(--muted);font-size:.92rem}
.foot{display:flex;align-items:center;justify-content:center;gap:8px}
.foot img{width:48px;height:auto}
.footfull{padding-top:12px}
.footfull img{width:200px;max-width:60vw}
.lg-d{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
:root[data-theme="dark"] .lg-l{display:none!important}:root[data-theme="dark"] .lg-d{display:block!important}
.tabs{display:flex;gap:6px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--calma);color:var(--surface)}
.phase{font-size:.85rem;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--calma-soft);color:var(--calma);align-self:flex-start}
.phase.base{background:var(--mov-soft);color:var(--mov)}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--calma);background:var(--calma-soft);color:var(--calma)}
.chip:focus-visible,.btn:focus-visible,.bchip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--calma);outline-offset:2px}
input[type=text],input[type=time],select,textarea{font:1rem var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;font:700 1rem var(--body);padding:13px 18px;cursor:pointer;min-height:48px;background:var(--calma);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--calma);border:1.5px solid var(--calma)}
.btn.mov{background:var(--mov)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer}
.stepper output{font:700 1.5rem var(--display);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.states{display:grid;grid-template-columns:1fr;gap:8px}
.state{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:600 1.05rem var(--body)}
.state .em{font-size:1.8rem;line-height:1}
.state small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.state[aria-pressed="true"]{border-color:var(--calma);background:var(--calma-soft)}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bchip{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:12px;cursor:pointer;text-align:left;font:600 .98rem var(--body);min-width:0}
.bchip .ic{font-size:1.9rem;line-height:1}
.bchip.calma{border-color:color-mix(in srgb,var(--calma) 45%,var(--line))}
.bchip.mov{border-color:color-mix(in srgb,var(--mov) 45%,var(--line))}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.tag.calma{background:var(--calma-soft);color:var(--calma)}
.tag.mov{background:var(--mov-soft);color:var(--mov)}
.tag.peq{background:var(--line);color:var(--muted)}
.dice{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dieface{width:56px;height:56px;border-radius:12px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font:700 1.8rem var(--display)}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.note{font-size:.92rem;border-left:3px solid var(--mov);padding:6px 10px;background:var(--mov-soft);border-radius:0 8px 8px 0}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:8px}
.orb{width:180px;height:180px;max-width:100%;border-radius:50%;display:grid;place-items:center;position:relative}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--calma-soft);transform:scale(.55);transition:transform 4s ease-in-out}
.orb.in::before{transform:scale(1)}
.orb.mov::before{background:var(--mov-soft)}
.orb span{position:relative;font:600 1.15rem var(--display);color:var(--ink)}
.clock{font:700 2.4rem var(--display);font-variant-numeric:tabular-nums;line-height:1}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:700 1.1rem var(--display);min-height:46px;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--calma);border-color:var(--calma);color:var(--surface)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--mov-soft);flex-wrap:wrap}
.pending b{font-variant-numeric:tabular-nums}
.banner{padding:10px 12px;border-radius:12px;font-size:.92rem;background:var(--mov-soft);color:var(--ink)}
.banner.ok{background:var(--calma-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp .it{display:flex;flex-direction:column;gap:4px}
.cmp .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
.cmp .hd em{font-style:normal;font-weight:600;font-size:.8rem}
.bar{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.bar .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.bar .fl.b{background:var(--mov)}
.bar .fl.i{background:var(--calma)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.better{color:var(--ok)} .worse{color:var(--danger)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:9}
.foot{font-size:.82rem;color:var(--muted);padding-top:8px}
.back{background:none;border:0;color:var(--calma);font:700 .95rem var(--body);cursor:pointer;padding:4px 0;align-self:flex-start}
@media (prefers-reduced-motion: reduce){.orb::before{transition:none}}
@media (max-width:360px){.bgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<script>
/* ---------- Contenido: respiraciones adaptadas de "Opciones de respiración consciente" (Mindful Arts San Francisco) ---------- */
const B = [
 {id:"estrella",n:"Estrella de mar",ic:"🖐️",t:"calma",s:["Abre una mano como una estrella de mar.","Con el índice de la otra mano, recorre el borde de los dedos.","Al subir por un dedo, inhala; al bajar, exhala.","Al terminar los cinco dedos, cambia de mano."],teen:"Preséntala como “respiración de cinco dedos”: es discreta y se puede hacer sobre el pupitre."},
 {id:"oceanica",n:"Respiración oceánica",ic:"🌊",t:"calma",s:["Cubre cada oreja con una mano ahuecada.","Inhala profundo por la nariz.","Exhala lento y escucha el sonido del mar dentro de ti.","Repite con los ojos cerrados o la mirada baja."],teen:"Funciona bien como “bajarle el volumen al mundo” por un minuto."},
 {id:"coyote",n:"Coyote tranquilo",ic:"🐺",t:"calma",peq:true,s:["Forma un coyote con la mano: el dedo del medio y el anular tocan el pulgar; el índice y el meñique son las orejas.","Inhala llenando la barriga.","Al exhalar, baja despacio el pulgar, como si el coyote abriera la boca.","Vuelve a cerrar y repite."]},
 {id:"rosa",n:"Huele la rosa, apaga la vela",ic:"🌹",t:"calma",s:["Imagina una rosa en una mano y una vela en la otra.","Inhala por la nariz oliendo la rosa.","Exhala por la boca, suave y largo, para apagar la vela.","Repite cinco veces."],teen:"Versión para grandes: inhala contando 4 y exhala contando 6. La exhalación larga es la que calma."},
 {id:"abeja",n:"Abeja zumbadora",ic:"🐝",t:"calma",s:["Inhala por la nariz como si sorbieras miel.","Exhala con la boca cerrada haciendo “bzzzz” hasta vaciar el aire.","Siente la vibración en la cara y el pecho.","Repite y cada vez zumba más bajito."],teen:"Llámala “zumbido”: la vibración larga baja el ritmo del grupo en segundos."},
 {id:"grifo",n:"Grifo de agua",ic:"🚰",t:"calma",s:["Extiende los brazos al frente con los puños juntos.","Aprieta fuerte las manos mientras inhalas.","Exhala abriendo los dedos, como agua que sale, con un “shhhh”.","Repite cuatro o cinco veces."],teen:"Es tensar y soltar: relajación muscular en versión rápida."},
 {id:"478",n:"Respiración 4-7-8",ic:"🔢",t:"calma",s:["Inhala por la nariz contando hasta 4.","Aguanta el aire contando hasta 7.","Exhala por la boca contando hasta 8.","Repite tres o cuatro veces."],small:"En K–3.º usa 4-4-6: retener 7 segundos es difícil para los más pequeños.",teen:"Ideal para 7.º–9.º. Puedes escribir el conteo en la pizarra."},
 {id:"pastel",n:"Pastel de cumpleaños",ic:"🎂",t:"calma",dice:true,peq:true,s:["Lanza el dado para saber cuántas velas tiene el pastel.","Levanta esa cantidad de dedos frente a la boca.","Inhala profundo y sopla una vela; baja un dedo.","Sigue hasta apagarlas todas y vuelve a lanzar."]},
 {id:"cuadrado",n:"Respiración cuadrada",ic:"⬜",t:"calma",s:["Levanta el dedo índice frente a ti.","Dibuja en el aire un lado del cuadrado mientras inhalas.","Dibuja el siguiente lado mientras exhalas.","Completa varias vueltas. También sirve un triángulo o un círculo."],teen:"La más aceptada en grados altos. Versión “caja”: inhala 4, aguanta 4, exhala 4, aguanta 4."},
 {id:"gratitud",n:"Flor de gratitud",ic:"🌸",t:"calma",s:["Pon las manos cerradas sobre el pupitre, como dos flores dormidas.","Con cada exhalación, piensa en algo o alguien por quien das gracias y abre un dedo.","Al abrir los diez dedos, lleva las manos al corazón.","Respira tres veces más. Quien quiera, comparte una."],note:"Toma un poco más de tiempo: separa 3 o 4 minutos."},
 {id:"amable",n:"Que yo sea amable",ic:"💛",t:"calma",s:["Manos sobre el corazón: “Que tenga un corazón amable”. Inhala.","Manos a los labios: “Que tenga palabras amables”. Inhala.","Manos a la frente: “Que tenga pensamientos amables”. Inhala.","Exhala despacio y baja las manos al pupitre."],teen:"En grados altos, que cada uno lo diga en silencio."},
 {id:"elefante",n:"Elefante",ic:"🐘",t:"mov",peq:true,s:["Sentados, manos en el regazo con los pulgares juntos.","Al inhalar, sube los pulgares, o los brazos completos como una trompa.","Al exhalar, bájalos despacio.","Repite cinco veces."]},
 {id:"mariposa",n:"Mariposa",ic:"🦋",t:"mov",s:["Junta las manos y los antebrazos frente a la cara, con los codos tocándose.","Al inhalar, abre y sube los codos como alas.","Al exhalar, ciérralos de nuevo.","Repite despacio."],teen:"Versión simple: subir los brazos al inhalar y bajarlos al exhalar."},

async function sb(path,body,prefer){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
  const r=await fetch(SB_URL+"/rest/v1/"+path,{signal:ctl.signal,method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json",...(prefer?{"Prefer":prefer}:{})},body:JSON.stringify(body||{})}).finally(()=>clearTimeout(to));
  if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(m||("Error "+r.status))}
  const t=await r.text(); return t?JSON.parse(t):null;
}

/* ---------- Guardado ---------- */
async function guardarNuevo(rec){
  rec.id=uuid(); rec.token=mkToken();
  try{ await sb("respira_registros",filaDB(rec),"return=minimal"); }
  catch(e){ rec._local=true; }
  mine[rec.id]=rec; saveMine(); showSync(); return rec.id;
}
async function guardarChequeo(id,cheq){
  const rec = mine[id]; if(!rec) return;
  rec.chequeo=cheq; rec.chequeoHecho=true; mine[id]=rec;
  if(rec._local){ rec._cheqLocal=true; }
  else{
    try{ await sb("rpc/respira_chequeo",{p_id:id,p_token:rec.token,p_chequeo:cheq}); rec._cheqLocal=false; }
    catch(e){ rec._cheqLocal=true; }
  }
  saveMine(); showSync();
}
async function syncPendientes(manual){
  const list=Object.values(mine).filter(r=>r._local||r._cheqLocal); if(!list.length){if(manual)toast("Todo está enviado");return}
  let ok=0;
  for(const r of list){
    try{
      if(r._local){ await sb("respira_registros",filaDB(r),"return=minimal"); r._local=false; }
      if(r.chequeoHecho&&r.chequeo){ await sb("rpc/respira_chequeo",{p_id:r.id,p_token:r.token,p_chequeo:r.chequeo}); r._cheqLocal=false; }
      ok++;
    }catch(e){ if(/duplicate|23505/i.test(e.message)){r._local=false;} }
  }
  // limpia registros viejos ya enviados
  const lim=Date.now()-7*864e5;
  Object.values(mine).forEach(r=>{if(!r._local&&!r._cheqLocal&&r.creado<lim)delete mine[r.id]});
  saveMine(); showSync(); if(manual) toast(ok?"Registros enviados":"Sin conexión todavía");
}

  view.innerHTML = `<section class="card">
    <h2>Registrado. Ahora a dar la clase.</h2>
    <p class="muted">${S.fase==="base"?"Esta semana no se hace respiración: solo observamos cómo llega el grupo.":"Gracias por probar la respiración con el grupo "+esc(rec.grupo)+"."} En 15 minutos contesta el chequeo breve de 6 preguntas.</p>
    <div class="timer"><div class="clock" id="wc"></div><span class="muted">para el chequeo</span></div>
    <button class="btn mov wide" id="ch">Hacer el chequeo ahora</button>
    <button class="btn ghost wide" id="home">Ir al inicio</button>
    <p class="muted" style="font-size:.88rem">Si cierras la app, el chequeo te espera en el inicio.</p>
  </section>`;
  const upd=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));$("#wc").textContent=Math.floor(s/60)+":"+pad(s%60);if(!s){clearInterval(waitT);$("#wc").textContent="¡Ya!"}};
  upd(); waitT=setInterval(upd,1000);
  $("#ch").onclick=()=>{clearInterval(waitT);S.cheqId=S.lastId;S.cheq={};S.view="chequeo";render()};
  $("#home").onclick=()=>{clearInterval(waitT);S.view="inicio";S.estado="";render()};
}

function vChequeo(){
  clearInterval(waitT);
  const rec=mine[S.cheqId]; const c=S.cheq;
  const opt=(arr,k)=>`<div class="chips">${arr.map((o,i)=>`<button class="chip" data-k="${k}" data-i="${i}" aria-pressed="${c[k+"_i"]===i}">${o.l}</button>`).join("")}</div>`;
  view.innerHTML = `<section class="card">
    <button class="back" id="bk">← Inicio</button>
    <h2>Chequeo · grupo ${esc(rec.grupo)}</h2>
    <p class="muted">Piensa en los primeros 15 minutos de clase.</p>
    <div class="field"><span class="label">1. ¿Cuánto tardó el grupo en estar listo para trabajar?</span>${opt(MIN_LISTO,"minutos")}</div>
    ${CHEQ.slice(0,3).map((q,i)=>`<div class="field"><span class="label">${i+2}. ${q.q}</span>${scaleHTML(q.k,c[q.k],q.lo,q.hi)}</div>`).join("")}
    <div class="field"><span class="label">5. ¿Cuántas veces redirigiste al grupo?</span>${opt(REDIR,"redir")}</div>
    <div class="field"><span class="label">6. ${CHEQ[3].q}</span>${scaleHTML("maestro",c.maestro,CHEQ[3].lo,CHEQ[3].hi)}</div>
    <div class="field"><label class="label" for="nota">Nota (opcional)</label><textarea id="nota" placeholder="Algo que llamó la atención">${esc(c.nota||"")}</textarea></div>
    <button class="btn wide" id="ok" disabled>Guardar chequeo</button>
  </section>`;
  const ready=()=>{$("#ok").disabled=!(c.minutos!=null&&c.redir!=null&&c.agitacion&&c.enfoque&&c.disposicion&&c.maestro)};
  view.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,i=+b.dataset.i,arr=k==="minutos"?MIN_LISTO:REDIR;
    c[k]=arr[i].v;c[k+"_i"]=i;view.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));ready()});
  CHEQ.forEach(q=>bindScale(q.k,v=>{c[q.k]=v;ready()}));
  $("#nota").oninput=e=>c.nota=e.target.value;
  $("#bk").onclick=()=>{S.view="inicio";render()};
  $("#ok").onclick=async()=>{
    $("#ok").disabled=true;
    await guardarChequeo(S.cheqId,{minutosListo:c.minutos,agitacion:c.agitacion,enfoque:c.enfoque,disposicion:c.disposicion,redirecciones:c.redir,maestro:c.maestro,nota:c.nota||"",hecho:Date.now()});
    toast("Chequeo guardado"); S.view="inicio"; S.estado=""; render();
  };
}

/* ---------- Resultados (panel con clave) ---------- */
function normal(r){return {...r,respiracionNombre:r.respiracion_nombre,participacionPct:r.participacion_pct,chequeoHecho:r.chequeo_hecho,alAzar:r.al_azar,duracionSeg:r.duracion_seg,creado:Date.parse(r.creado)}}
async function cargarTodo(){
  try{ const rows=await sb("rpc/respira_admin_datos",{p_clave:S.clave}); S.all=(rows||[]).map(normal); S.loginErr=""; return true; }
  catch(e){
    const mala=/clave/i.test(e.message||"");
    if(mala){S.clave="";try{sessionStorage.removeItem("rr_clave")}catch(_){}}
    S.loginErr = mala ? "Clave incorrecta. Revisa que esté en mayúsculas." : "No se pudo conectar con la base de datos. Abre la app desde su enlace publicado (Netlify o GitHub Pages), no desde una vista previa del archivo, y verifica tu internet.";
    toast(mala?"Clave incorrecta":"No se pudo conectar"); return false; }
}
function vLogin(){
  view.innerHTML=`<section class="card"><button class="back" id="bk">← Volver al registro</button>
    <h2>Panel de resultados</h2><p class="muted">Solo para la psicóloga escolar.</p>
    <form id="lf" class="field"><label class="label" for="clave">Clave</label><input type="text" id="clave" autocomplete="off" autocapitalize="characters">
    <button class="btn wide" type="submit" id="lbtn">Entrar</button><p id="lmsg" class="banner" ${S.loginErr?"":"hidden"}>${esc(S.loginErr||"")}</p></form></section>`;
  $("#bk").onclick=()=>{S.tab="reg";render()};
  $("#lf").onsubmit=async e=>{e.preventDefault();
    const btn=$("#lbtn"),msg=$("#lmsg");
    S.clave=$("#clave").value.trim().toUpperCase();
    if(!S.clave){msg.hidden=false;msg.textContent="Escribe la clave.";return}
    btn.disabled=true;btn.textContent="Entrando…";msg.hidden=true;
    const ok=await cargarTodo();
    if(ok){try{sessionStorage.setItem("rr_clave",S.clave)}catch(_){}renderResultados()}
    else{btn.disabled=false;btn.textContent="Entrar";msg.hidden=false;msg.textContent=S.loginErr}};
}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const f1=v=>v==null?"—":(Math.round(v*10)/10).toString();
function renderResultados(){
  if(!S.clave) return vLogin();
  const grupos=[...new Set(S.all.map(r=>r.grupo))].sort();
  const data=S.all.filter(r=>S.filtroGrupo==="todos"||r.grupo===S.filtroGrupo);
  const base=data.filter(r=>r.fase!=="intervencion"&&r.chequeoHecho), inte=data.filter(r=>r.fase==="intervencion"&&r.chequeoHecho);
  const M=[
    {k:"agitacion",n:"Tranquilidad del grupo",max:5,up:true},
    {k:"enfoque",n:"Enfoque en la tarea",max:5,up:true},
    {k:"disposicion",n:"Disposición a trabajar",max:5,up:true},
    {k:"maestro",n:"Calma del maestro",max:5,up:true},
    {k:"minutosListo",n:"Minutos hasta estar listos",max:12,up:false},
    {k:"redirecciones",n:"Redirecciones",max:7,up:false}
  ];
  const cmp=M.map(m=>{
    const a=avg(base.map(r=>r.chequeo?.[m.k]).filter(v=>v!=null)), b=avg(inte.map(r=>r.chequeo?.[m.k]).filter(v=>v!=null));
    let d=""; if(a!=null&&b!=null){const diff=b-a;const good=m.up?diff>0:diff<0;d=Math.abs(diff)<0.05?`<em>sin cambio</em>`:`<em class="${good?"better":"worse"}">${diff>0?"+":""}${f1(diff)}</em>`}
    const w=v=>v==null?0:Math.min(100,100*v/m.max);
    return `<div class="it"><div class="hd"><span>${m.n}</span>${d}</div>
      <div class="bar"><span>Línea base</span><div class="tr"><div class="fl b" style="width:${w(a)}%"></div></div><b>${f1(a)}</b></div>
      <div class="bar"><span>Respiración</span><div class="tr"><div class="fl i" style="width:${w(b)}%"></div></div><b>${f1(b)}</b></div></div>`;
  }).join("");
  const byResp={}; data.filter(r=>r.respiracion).forEach(r=>{(byResp[r.respiracionNombre]??=[]).push(r)});
  const respRows=Object.entries(byResp).sort((a,b)=>b[1].length-a[1].length).map(([n,rs])=>`<tr><td>${esc(n)}</td><td class="n">${rs.length}</td><td class="n">${f1(avg(rs.map(r=>r.participacionPct)))}%</td><td class="n">${f1(avg(rs.map(r=>r.conexion)))}</td><td class="n">${f1(avg(rs.filter(r=>r.chequeo).map(r=>r.chequeo.enfoque)))}</td></tr>`).join("");
  const byEst=ESTADOS.map(e=>{const rs=data.filter(r=>r.estado===e.id);return `<tr><td>${e.em} ${e.n}</td><td class="n">${rs.filter(r=>r.fase!=="intervencion").length}</td><td class="n">${rs.filter(r=>r.fase==="intervencion").length}</td></tr>`}).join("");
  const maestros=new Set(data.map(r=>r.maestro)).size;
  view.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <section class="card">
      <h2>Fase del estudio</h2>
      <p class="muted">Lo que escojas aquí cambia lo que ven todos los maestros al registrar.</p>
      <div class="chips"><button class="chip" data-f="base" aria-pressed="${S.fase!=="intervencion"}">Línea base (sin respiración)</button><button class="chip" data-f="intervencion" aria-pressed="${S.fase==="intervencion"}">Intervención (con respiración)</button></div>
    </section>
    <section class="card">
      <div class="row" style="justify-content:space-between"><h2>Resultados</h2><button class="btn ghost" id="refr">Actualizar</button>
        <select id="fg" style="max-width:170px" aria-label="Filtrar por grupo"><option value="todos">Todos los grupos</option>${grupos.map(g=>`<option ${g===S.filtroGrupo?"selected":""}>${esc(g)}</option>`).join("")}</select></div>
      ${S.all.length?"":`<p class="banner ok">Todavía no hay registros. Aparecerán aquí en cuanto los maestros comiencen a usar la app.</p>`}
      <div class="kpis"><div class="kpi"><b>${data.length}</b><span>registros</span></div><div class="kpi"><b>${maestros}</b><span>maestros</span></div><div class="kpi"><b>${data.filter(r=>r.chequeoHecho).length}</b><span>chequeos completos</span></div></div>
      <p class="muted" style="font-size:.88rem">Promedio de los chequeos a los 15 minutos. Escalas de 1 a 5, donde 5 es mejor; minutos y redirecciones, mientras menos, mejor. Base: ${base.length} · Respiración: ${inte.length}.</p>
      <div class="cmp">${cmp}</div>
    </section>
    <section class="card"><h3>Cómo llegaban los grupos</h3><div class="tbl"><table><thead><tr><th>Estado al entrar</th><th>Base</th><th>Respiración</th></tr></thead><tbody>${byEst}</tbody></table></div></section>
    <section class="card"><h3>Respiraciones usadas</h3>${respRows?`<div class="tbl"><table><thead><tr><th>Respiración</th><th>Veces</th><th>Particip.</th><th>Conexión</th><th>Enfoque</th></tr></thead><tbody>${respRows}</tbody></table></div>`:`<p class="muted">Aparecerán durante la fase de intervención.</p>`}</section>
    <section class="card"><h3>Registros</h3>
      <p class="muted">Para borrar pruebas o entradas con error. Toca “Borrar” y luego “Confirmar”.</p>
      ${data.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Maestro</th><th>Grupo</th><th>Fase</th><th>Chequeo</th><th></th></tr></thead><tbody>${[...data].sort((a,b)=>b.creado-a.creado).map(r=>`<tr><td>${esc(r.fecha)}</td><td>${esc(r.hora)}</td><td>${esc(r.maestro)}</td><td>${esc(r.grupo)}</td><td>${r.fase==="intervencion"?"Resp.":"Base"}</td><td>${r.chequeoHecho?"Sí":"—"}</td><td><button class="chip" data-del="${r.id}" style="min-height:34px;padding:4px 12px">Borrar</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No hay registros.</p>`}
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px"><label class="label" for="confTodo">Borrar todos los registros</label>
        <p class="muted" style="font-size:.88rem">Úsalo para empezar en cero antes del estudio real. Escribe BORRAR para confirmar.</p>
        <div class="row"><input type="text" id="confTodo" autocomplete="off" autocapitalize="characters" style="max-width:160px"><button class="btn mov" id="delTodo">Borrar todo</button></div></div>
    </section>
    <section class="card"><h3>Exportar</h3><p class="muted">Todos los registros en formato CSV para Excel o Google Sheets.</p><div class="row"><button class="btn" id="dl">Descargar CSV</button><button class="btn ghost" id="cp">Copiar CSV</button></div></section>
    <button class="btn ghost wide" id="salir">Cerrar panel</button>
  </div>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{
    try{ S.fase=await sb("rpc/respira_set_fase",{p_clave:S.clave,p_fase:b.dataset.f}); paintPhase(); toast("Fase actualizada"); renderResultados(); }catch(e){ toast("No se pudo cambiar la fase") }
  });
  $("#refr").onclick=async()=>{if(await cargarTodo())renderResultados()};
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar";b.style.borderColor="var(--danger)";b.style.color="var(--danger)";setTimeout(()=>{if(b.isConnected&&b.dataset.armed==="1"){b.dataset.armed="";b.textContent="Borrar";b.style.borderColor="";b.style.color=""}},4000);return}
    b.disabled=true;
    try{await sb("rpc/respira_admin_quitar",{p_clave:S.clave,p_ids:[b.dataset.del]});toast("Registro borrado");if(await cargarTodo())renderResultados()}catch(e){toast("No se pudo borrar");b.disabled=false}
  });
  $("#delTodo").onclick=async()=>{
    if($("#confTodo").value.trim().toUpperCase()!=="BORRAR"){toast("Escribe BORRAR para confirmar");return}
    try{const n=await sb("rpc/respira_admin_quitar_todo",{p_clave:S.clave,p_confirmacion:"BORRAR"});toast(n+" registros borrados");if(await cargarTodo())renderResultados()}catch(e){toast("No se pudo borrar")}
  };
  $("#salir").onclick=()=>{S.clave="";S.all=[];try{sessionStorage.removeItem("rr_clave")}catch(_){}S.tab="reg";render()};
  $("#fg").onchange=e=>{S.filtroGrupo=e.target.value;renderResultados()};
  $("#cp").onclick=()=>copyText(toCSV(S.all),"CSV copiado");
  $("#dl").onclick=async()=>{
    const blob=new Blob(["\ufeff"+toCSV(S.all)],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recrea-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}

/* ---------- Utilidades ---------- */
function toCSV(rows){
  const cols=["fecha","hora","bloque","fase","maestro","grado","grupo","presentes","estado","respiracionNombre","tipo","alAzar","duracionSeg","participaron","participacionPct","conexion","chequeoHecho","minutosListo","agitacion","enfoque","disposicion","redirecciones","calmaMaestro","nota"];
  const val=(r,c)=>{const ch=r.chequeo||{};const m={minutosListo:ch.minutosListo,agitacion:ch.agitacion,enfoque:ch.enfoque,disposicion:ch.disposicion,redirecciones:ch.redirecciones,calmaMaestro:ch.maestro,nota:ch.nota};return c in m?m[c]:r[c]};
  const q=v=>v==null?"":/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:String(v);
  return [cols.join(","),...rows.sort((a,b)=>a.creado-b.creado).map(r=>cols.map(c=>q(val(r,c))).join(","))].join("\n");
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg)}
  catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(_){toast("Selecciona y copia el texto")}ta.remove()}
}

$("#tabReg").onclick=()=>{S.tab="reg";render()};
$("#tabRes").onclick=async()=>{S.tab="res";render();if(S.clave&&await cargarTodo())renderResultados()};
try{S.clave=sessionStorage.getItem("rr_clave")||""}catch(_){}
S.fase=ls.get("rr_fase","base"); paintPhase(); render(); showSync(); syncPendientes(false);
if(S.clave) cargarTodo();
window.addEventListener("online",()=>syncPendientes(false));
setInterval(()=>{if(S.tab==="reg"&&S.view==="inicio"&&pendientes().length&&!document.activeElement?.matches("input,textarea"))render()},30000);
</script>
